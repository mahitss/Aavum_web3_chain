services:
  agent-worker:
    build:
      context: ./agent-worker
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      AEVUM_RPC_URL: ${AEVUM_RPC_URL:-https://rpc-test.qday.info}
      WORKER_PRIVATE_KEY: ${WORKER_PRIVATE_KEY}
      NEXUS_ESCROW_ADDRESS: ${NEXUS_ESCROW_ADDRESS}
      WORKER_PORT: 8080
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_DEMO_FAULTS: ${ENABLE_DEMO_FAULTS:-false}
    networks:
      - nexus402-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  agent-orchestrator:
    build:
      context: ./agent-orchestrator
    env_file:
      - .env
    ports:
      - "8081:8081"
    environment:
      AEVUM_RPC_URL: ${AEVUM_RPC_URL:-https://rpc-test.qday.info}
      AEVUM_CHAIN_ID: ${AEVUM_CHAIN_ID:-44005}
      TUSD8_ADDRESS: ${TUSD8_ADDRESS:-0x456569838f1d43009A91ebA4263147Afd7233483}
      NEXUS_ESCROW_ADDRESS: ${NEXUS_ESCROW_ADDRESS}
      PRINCIPAL_ADDRESS: ${PRINCIPAL_ADDRESS}
      ORCHESTRATOR_AGENT_PRIVATE_KEY: ${ORCHESTRATOR_AGENT_PRIVATE_KEY}
      WORKER_URL: http://agent-worker:8080
      WORKER_URLS: ${WORKER_URLS:-http://agent-worker:8080}
      ORCHESTRATOR_PORT: 8081
      PER_TASK_LIMIT: ${PER_TASK_LIMIT:-1000000}
      HOURLY_LIMIT: ${HOURLY_LIMIT:-10000000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ENABLE_PUBLIC_SANDBOX: ${ENABLE_PUBLIC_SANDBOX:-false}
      SANDBOX_MAX_JOBS_PER_IP_HOUR: ${SANDBOX_MAX_JOBS_PER_IP_HOUR:-5}
    networks:
      - nexus402-network
    depends_on:
      agent-worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_NEXUS_ESCROW_ADDRESS: ${NEXUS_ESCROW_ADDRESS}
        NEXT_PUBLIC_API_URL: http://localhost:8081
        NEXT_PUBLIC_ORCHESTRATOR_API_URL: http://localhost:8081
        NEXT_PUBLIC_AEVUM_RPC_URL: ${AEVUM_RPC_URL:-https://rpc-test.qday.info}
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    networks:
      - nexus402-network
    depends_on:
      agent-orchestrator:
        condition: service_healthy
    restart: unless-stopped

networks:
  nexus402-network:
    driver: bridge
