[package]
name = "nexus402-worker"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
alloy = { version = "2", default-features = false, features = ["std", "essentials", "reqwest"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["ring", "http1", "tls12"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
anyhow = "1"
axum = "0.8"
dotenvy = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
